<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 44" width="176" height="44" role="img" aria-label="CosmOS AI">
  <rect x="0" y="6" width="32" height="32" rx="9" fill="#f8fafc"/>
  <text x="16" y="28.5" text-anchor="middle" font-family="Inter,-apple-system,Segoe UI,sans-serif"
        font-size="18" font-weight="700" fill="#0f172a">C</text>
  <!-- dx rather than a second absolute x: the gap is then measured from where
       "CosmOS" actually ends, which is font-dependent. Hardcoding the position
       rendered as "CosmOSAI" the moment the fallback face was a shade wider. -->
  <text y="29" font-family="Inter,-apple-system,Segoe UI,sans-serif"
        font-size="21" font-weight="650" letter-spacing="-0.5">
    <tspan x="44" fill="#f8fafc">CosmOS</tspan><tspan dx="8" fill="#598cff">AI</tspan>
  </text>
</svg>
